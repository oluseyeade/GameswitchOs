{% extends 'base.html' %}
{% block title %}Register | GameSwitchOS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="glass-card p-4 p-md-5">
      <h2 class="mb-4">Create Account</h2>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post" class="vstack gap-3">
        <input class="form-control" name="full_name" placeholder="Full name" required>
        <input type="email" class="form-control" name="email" placeholder="Email" required>
        <input class="form-control" name="phone" placeholder="Phone number" required>
        <select class="form-select" name="branch" required>
          <option value="branch1">Preferred Branch: Branch 1</option>
          <option value="branch2">Preferred Branch: Branch 2</option>
        </select>
        <input type="password" class="form-control" name="password" placeholder="Password" required>
        <button class="btn btn-primary" type="submit">Register</button>
      </form>
      <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('user.login') }}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
