<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>GameSwitchOS Welcome</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-user-home">

  <div class="welcome-box">
    <div class="title">
      <div class="brand-logo" aria-label="GameSwitchOS">
        <span class="brand-core">Game</span><span class="brand-accent">SwitchOS</span>
      </div>
      <p class="subtitle">Your Gaming Portal Experience Starts Here</p>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <a href="{{ url_for('user.register') }}" class="card-box d-block">
          <img src="{{ url_for('static', filename='img/lounge.jpg') }}" alt="register">
          <div class="card-content">
            <div class="icon">
              <i class="fa-solid fa-user-plus"></i>
            </div>
            <h3>Register</h3>
            <div class="logo">
              <p>Create your Game<span>SwitchOS</span> account</p>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-6">
        <a href="{{ url_for('user.login') }}" class="card-box d-block">
          <img src="{{ url_for('static', filename='img/image2.jpg') }}" alt="Login">
          <div class="card-content">
            <div class="icon">
              <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h3>Login</h3>
            <div class="logo">
              <p>Access your Game<span>SwitchOS</span> account</p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
